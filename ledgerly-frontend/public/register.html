<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Ledgerly</title><link rel="stylesheet" href="/output.css"></head><body class="min-h-screen"><main class="mx-auto flex min-h-screen max-w-xl items-center p-5"><section class="card w-full p-7 sm:p-10"><a href="/" class="text-xl font-bold">ledgerly<span class="text-brand">.</span></a><h1 class="mt-9 text-2xl font-semibold">Start banking simply</h1><p class="mt-2 text-sm text-slate-500">Create your free Ledgerly account in a minute.</p><form data-auth-form data-mode="register" class="mt-8 space-y-4" novalidate><p data-form-error role="alert" class="hidden rounded-xl bg-rose-50 p-3 text-sm text-rose-700"></p><div><label class="field-label" for="name">Full name</label><input class="field" id="name" name="name" autocomplete="name" placeholder="Your name" required></div><div><label class="field-label" for="email">Email address</label><input class="field" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div><label class="field-label" for="password">Password</label><input class="field" id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required></div><div><label class="field-label" for="confirm-password">Confirm password</label><input class="field" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password" minlength="8" required></div><button class="btn-primary mt-2 w-full" type="submit">Create account</button></form><p class="mt-7 text-center text-sm text-slate-500">Already have an account? <a class="font-semibold text-brand hover:text-indigo-700" href="/login.html">Sign in</a></p></section></main><script type="module" src="/js/auth.js"></script></body></html>
