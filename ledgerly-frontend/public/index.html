<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — Ledgerly</title><link rel="stylesheet" href="/output.css"></head><body><header class="border-b border-slate-100 bg-white"><nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-5"><a class="text-xl font-bold" href="/index.html">ledgerly<span class="text-brand">.</span></a><div class="flex items-center gap-4"><a class="hidden text-sm font-medium text-slate-600 hover:text-brand sm:block" href="/history.html">All transactions</a><button data-logout class="btn-secondary px-3 py-2">Log out</button></div></nav></header><main class="mx-auto max-w-6xl px-5 py-8 sm:py-12"><div class="fade-in flex flex-col justify-between gap-4 sm:flex-row sm:items-end"><div><p class="text-sm font-medium text-slate-500">OVERVIEW</p><h1 class="mt-1 text-3xl font-semibold tracking-tight">Your money, at a glance.</h1></div><p class="text-sm text-slate-500">Last updated <span data-updated>just now</span></p></div><section class="card mt-8 overflow-hidden bg-ink p-7 text-white sm:p-9"><p class="text-sm font-medium text-indigo-200">CURRENT BALANCE</p><p data-balance class="mt-3 text-4xl font-semibold tracking-tight sm:text-5xl">Loading…</p><p class="mt-7 text-sm text-slate-300">Available to spend</p></section><section class="mt-8 grid gap-3 sm:grid-cols-3"><button data-action="deposit" class="btn-secondary justify-start px-5"><span class="rounded-lg bg-emerald-100 px-2 py-1 text-emerald-700">↓</span> Deposit</button><button data-action="withdraw" class="btn-secondary justify-start px-5"><span class="rounded-lg bg-rose-100 px-2 py-1 text-rose-700">↑</span> Withdraw</button><button data-action="transfer" class="btn-secondary justify-start px-5"><span class="rounded-lg bg-indigo-100 px-2 py-1 text-indigo-700">↗</span> Transfer</button></section><section class="mt-10"><div class="flex items-center justify-between"><div><h2 class="text-xl font-semibold">Recent activity</h2><p class="mt-1 text-sm text-slate-500">Your latest account movements.</p></div><a class="text-sm font-semibold text-brand hover:text-indigo-700" href="/history.html">View all →</a></div><div data-recent class="card mt-5 divide-y divide-slate-100"></div></section></main><div data-modal class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/40 p-5"><section class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="flex items-center justify-between"><h2 data-modal-title id="modal-title" class="text-xl font-semibold">Transaction</h2><button data-close-modal class="rounded-lg px-2 py-1 text-xl text-slate-500 hover:bg-slate-100" aria-label="Close">×</button></div><form data-transaction-form class="mt-6 space-y-5"><p data-transaction-error role="alert" class="hidden rounded-xl bg-rose-50 p-3 text-sm text-rose-700"></p><div data-recipient class="hidden"><label class="field-label" for="recipient">Recipient account ID</label><input class="field" id="recipient" name="toAccountId" placeholder="Account ID"></div><div><label class="field-label" for="amount">Amount (INR)</label><input class="field" id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></div><button class="btn-primary w-full" type="submit">Continue</button></form></section></div><script type="module" src="/js/dashboard.js"></script></body></html>
